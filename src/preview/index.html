<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; font-family: "Segoe UI", sans-serif; }
  #strip { display: flex; gap: 12px; align-items: flex-end; padding: 16px; width: max-content; }
  .card { position: relative; width: 240px; height: 176px; border-radius: 10px; overflow: hidden; background: #1c1c1e; box-shadow: 0 8px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.12); cursor: grab; transition: transform .15s ease, opacity .25s ease; animation: pop .25s cubic-bezier(.2,.9,.3,1.3); }
  .card:active { cursor: grabbing; }
  .drag { cursor: grab; }
  .bar, .close { cursor: default; }
  .card.leaving { opacity: 0; transform: translateY(20px) scale(.95); }
  .card img { display: block; width: 100%; height: 140px; object-fit: contain; background: #0f0f10; pointer-events: none; }
  .dims { position: absolute; top: 6px; right: 6px; padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #ddd; background: rgba(0,0,0,0.6); pointer-events: none; }
  .bar { display: flex; justify-content: center; align-items: center; height: 36px; }
  .status { font-size: 11px; color: #D97757; }
  .actions { display: flex; gap: 4px; }
  .card:hover .actions { opacity: 1; }
  .actions button { all: unset; cursor: pointer; padding: 3px 7px; border-radius: 5px; color: #fff; font-size: 11px; background: rgba(255,255,255,0.1); }
  .actions button:hover { background: rgba(255,255,255,0.22); }
  .actions button.danger:hover { background: #c0392b; }
  .close { position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.65); color: #fff; font-size: 13px; line-height: 20px; text-align: center; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .card:hover .close { opacity: 1; }
  .progress { position: absolute; bottom: 0; left: 0; height: 2px; background: #4c9aff; width: 100%; transform-origin: left; }
  .toast { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); color: #fff; font-size: 13px; pointer-events: none; }
  @keyframes pop { from { transform: translateY(30px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
  <div id="strip"></div>
  <script src="preview.js"></script>
</body>
</html>
