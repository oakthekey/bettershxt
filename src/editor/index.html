<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #141416; color: #eee; font-family: "Segoe UI", sans-serif; user-select: none; overflow: hidden; }
  #toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; background: #1f1f22; border-bottom: 1px solid #2c2c30; -webkit-app-region: drag; }
  #toolbar * { -webkit-app-region: no-drag; }
  .tool, .btn { all: unset; cursor: pointer; padding: 5px 9px; border-radius: 6px; font-size: 12px; white-space: nowrap; color: #ddd; background: rgba(255,255,255,0.06); }
  .tool:hover, .btn:hover { background: rgba(255,255,255,0.14); }
  .tool.active { background: #4c9aff; color: #fff; }
  .sep { width: 1px; height: 22px; background: #333; margin: 0 2px; }
  .swatch { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatch.active { border-color: #fff; }
  #size { width: 80px; }
  .spacer { flex: 1; }
  .btn.primary { background: #4c9aff; color: #fff; }
  .btn.primary:hover { background: #3b88ee; }
  #wrap { position: absolute; top: 44px; bottom: 0; left: 0; right: 0; overflow: auto; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas { display: block; }
  #draw { position: absolute; inset: 0; cursor: crosshair; }
  #textInput { position: absolute; display: none; background: transparent; border: 1px dashed #fff; outline: none; color: inherit; font-family: "Segoe UI", sans-serif; padding: 2px 4px; min-width: 40px; }
  kbd { display: none; }
  #size { width: 60px; }
</style>
</head>
<body>
  <div id="toolbar">
    <button class="tool active" data-t="arrow" title="Arrow (A)">Arrow<kbd>A</kbd></button>
    <button class="tool" data-t="rect" title="Rect (R)">Rect<kbd>R</kbd></button>
    <button class="tool" data-t="ellipse" title="Ellipse (E)">Oval<kbd>E</kbd></button>
    <button class="tool" data-t="line" title="Line (L)">Line<kbd>L</kbd></button>
    <button class="tool" data-t="pen" title="Pen (P)">Pen<kbd>P</kbd></button>
    <button class="tool" data-t="highlight" title="Highlight (H)">Mark<kbd>H</kbd></button>
    <button class="tool" data-t="text" title="Text (T)">Text<kbd>T</kbd></button>
    <button class="tool" data-t="blur" title="Blur (B)">Blur<kbd>B</kbd></button>
    <div class="sep"></div>
    <div id="colors"></div>
    <input id="size" type="range" min="1" max="20" value="4" title="Stroke width">
    <div class="sep"></div>
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo<kbd>Ctrl+Z</kbd></button>
    <button class="btn" id="redo" title="Redo (Ctrl+Y)">Redo<kbd>Ctrl+Y</kbd></button>
    <div class="spacer"></div>
    <button class="btn" id="copy" title="Copy to clipboard (Ctrl+C)">Copy</button>
    <button class="btn primary" id="save" title="Save and close (Ctrl+S)">Save<kbd>Ctrl+S</kbd></button>
    <button class="btn" id="close" title="Close (Esc)">Close<kbd>Esc</kbd></button>
  </div>
  <div id="wrap">
    <div id="stage">
      <canvas id="base"></canvas>
      <canvas id="draw"></canvas>
      <input id="textInput" type="text">
    </div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
